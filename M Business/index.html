<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Sans:wght@300;400;500;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <title>M Business</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    /* Prevent a flash of the wrong background color before React mounts
         and applies the app's actual theme (light/dark). This matches the
         app's default light theme background so refresh/first paint looks
         seamless instead of flashing plain white or browser-default black. */
    html,
    body {
      margin: 0;
      background: #F5FAFA;
    }

    html.dark-mode,
    body.dark-mode {
      background: #0a1628;
    }

    #root {
      min-height: 100vh;
      background: inherit;
    }
  </style>
  <script>
    // Apply dark mode class and the correct --app-bg variable as early as
    // possible, before React even loads, by reading the same localStorage
    // key the app already uses. Without this, the page shows the plain
    // fallback background, then flashes to the real themed background
    // once AdminDashboard's own inline <style> tag mounts and defines
    // --app-bg for the first time.
    (function () {
      try {
        var dm = localStorage.getItem("empDarkMode") === "true" || localStorage.getItem("adminDarkMode") === "true";
        var THEMES = {
          purple: { sidebar: "#7c3aed", bg: "#f5f3ff" },
          ocean: { sidebar: "#0284c7", bg: "#f0f9ff" },
          forest: { sidebar: "#16a34a", bg: "#f0fdf4" },
          sunset: { sidebar: "#ea580c", bg: "#fff7ed" },
          rose: { sidebar: "#e11d48", bg: "#fff1f2" },
          slate: { sidebar: "#475569", bg: "#f8fafc" },
          mint: { sidebar: "#0d9488", bg: "#f0fdfa" },
          candy: { sidebar: "#c026d3", bg: "#fdf4ff" },
          teal: { sidebar: "#00BCD4", bg: "#F5FAFA" }
        };
        var appTheme = localStorage.getItem("appTheme") || "teal";
        var sidebarColor, bgColor;
        if (appTheme === "custom") {
          var customColor = localStorage.getItem("appCustomColor") || "#00BCD4";
          sidebarColor = customColor;
          bgColor = "#F5FAFA";
        } else {
          var t = THEMES[appTheme] || THEMES.teal;
          sidebarColor = t.sidebar;
          bgColor = t.bg;
        }
        if (dm) {
          document.documentElement.classList.add("dark-mode");
          document.documentElement.style.setProperty("--app-bg", "#0a1628");
          document.documentElement.style.setProperty("--app-sidebar", "#0a1628");
        } else {
          document.documentElement.style.setProperty("--app-bg", bgColor);
          document.documentElement.style.setProperty("--app-sidebar", sidebarColor);
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <script>
    (function () {
      if (window.location.pathname.startsWith('/client-portal/') && window.location.search.includes('token=')) {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (token) {
          window.__PORTAL_TOKEN__ = token;
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
